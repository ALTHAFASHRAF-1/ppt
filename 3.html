 <html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OB Exam Prep Quiz</title>
    <style>
        :root {
            --primary: #4a90e2;
            --secondary: #f5f7fa;
            --success: #2ecc71;
            --danger: #e74c3c;
            --text: #2c3e50;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--secondary);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .quiz-container {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 600px;
            text-align: center;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-weight: bold;
            flex-wrap: wrap;
            gap: 10px;
        }

        .question {
            font-size: 1.4rem;
            margin-bottom: 1.5rem;
            min-height: 80px;
            line-height: 1.4;
        }

        .options {
            display: grid;
            gap: 10px;
        }

        .option-btn {
            background: var(--secondary);
            border: 2px solid #ddd;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
            outline: none;
            text-align: left;
        }

        .option-btn:hover:not([disabled]) {
            background: #e1e5ea;
            border-color: var(--primary);
        }

        .correct {
            background-color: var(--success) !important;
            color: white !important;
            border-color: #27ae60 !important;
        }

        .wrong {
            background-color: var(--danger) !important;
            color: white !important;
            border-color: #c0392b !important;
        }

        .results {
            display: none;
        }

        #next-btn {
            margin-top: 20px;
            padding: 10px 25px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            display: none;
        }

        .score-display {
            margin-top: 15px;
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--text);
        }

        .progress-bar {
            height: 5px;
            background-color: #eee;
            border-radius: 2px;
            margin: 15px 0;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            background-color: var(--primary);
            width: 0%;
            transition: width 0.5s;
        }

        .start-selector {
            padding: 5px 10px;
            border-radius: 5px;
            border: 2px solid var(--primary);
            background: white;
            color: var(--text);
            font-weight: bold;
            cursor: pointer;
            outline: none;
        }

        .start-selector:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(74, 144, 226, 0.2);
        }
    </style>
</head>
<body>

<div class="quiz-container" id="quiz">
    <div class="header">
        <span><span id="q-num">1</span>/<span id="total-questions">275</span></span>
        <select class="start-selector" id="start-selector" onchange="changeStartQuestion()">
            <!-- Options will be populated by JavaScript -->
        </select>
    </div>
    <div class="progress-bar">
        <div class="progress" id="progress-bar"></div>
    </div>
    <div class="question" id="question-text">Loading question...</div>
    <div class="options" id="options-container"></div>
    <div class="score-display">Score: <span id="current-score">0</span>/<span id="total-score">275</span></div>
    <button id="next-btn" onclick="nextQuestion()">Next Question</button>

    <div class="results" id="results">
        <h2>Quiz Complete!</h2>
        <p>Your Final Score: <span id="score">0</span>/<span id="final-total">275</span></p>
        <p id="performance-message"></p>
        <button onclick="location.reload()" style="padding: 10px 20px; cursor: pointer; margin-top: 15px;">Restart Quiz</button>
    </div>
</div>

    let currentIdx = 0;
    let score = 0;
    const totalQuestions = quizData.length;

    const qNum = document.getElementById('q-num');
    const totalQuestionsEl = document.getElementById('total-questions');
    const nextBtn = document.getElementById('next-btn');
    const currentScore = document.getElementById('current-score');
    const totalScore = document.getElementById('total-score');
    const finalTotal = document.getElementById('final-total');
    const progressBar = document.getElementById('progress-bar');
    const startSelector = document.getElementById('start-selector');

    // Populate the dropdown with question numbers
    function populateStartSelector() {
        startSelector.innerHTML = '';
        for (let i = 1; i <= totalQuestions; i++) {
            const option = document.createElement('option');
            option.value = i - 1; // zero-based index
            option.textContent = i;
            startSelector.appendChild(option);
        }
        startSelector.value = 0; // Default to first question
    }

    // Change starting question
    function changeStartQuestion() {
        const newStart = parseInt(startSelector.value);
        if (newStart >= 0 && newStart < totalQuestions) {
            currentIdx = newStart;
            score = 0;
            currentScore.textContent = score;
            loadQuestion();
        }
    }

    function updateProgressBar() {
        const progress = ((currentIdx + 1) / totalQuestions) * 100;
        progressBar.style.width = `${progress}%`;
    }

    function loadQuestion() {
        const data = quizData[currentIdx];
        qText.innerText = data.q;
        qNum.innerText = currentIdx + 1;
        optionsCont.innerHTML = '';
        nextBtn.style.display = 'none';
        updateProgressBar();

        // Update selector to current question
        startSelector.value = currentIdx;

        data.o.forEach((opt, i) => {
            const btn = document.createElement('button');
            btn.innerText = `${String.fromCharCode(97 + i)}. ${opt}`;
            btn.classList.add('option-btn');
            btn.onclick = () => revealAnswer(i);
            optionsCont.appendChild(btn);
        });
    }

    function revealAnswer(selectedIdx) {
        const correctIdx = quizData[currentIdx].a;
        const buttons = optionsCont.getElementsByClassName('option-btn');

        for (let i = 0; i < buttons.length; i++) {
            buttons[i].disabled = true;
            if (i === correctIdx) {
                buttons[i].classList.add('correct');
            }
            if (i === selectedIdx && selectedIdx !== correctIdx) {
                buttons[i].classList.add('wrong');
            }
        }

        if (selectedIdx === correctIdx) {
            score++;
            currentScore.textContent = score;
        }
        nextBtn.style.display = 'inline-block';
    }

    function nextQuestion() {
        currentIdx++;
        if (currentIdx < totalQuestions) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        document.getElementById('question-text').style.display = 'none';
        optionsCont.style.display = 'none';
        document.querySelector('.header').style.display = 'none';
        document.querySelector('.score-display').style.display = 'none';
        nextBtn.style.display = 'none';
        progressBar.style.display = 'none';
        
        const res = document.getElementById('results');
        res.style.display = 'block';
        document.getElementById('score').innerText = score;
        document.getElementById('final-total').innerText = totalQuestions;
        
        const performanceMsg = document.getElementById('performance-message');
        const percentage = (score / totalQuestions) * 100;
        
        if (percentage >= 90) {
            performanceMsg.textContent = "Outstanding! You have mastered Organizational Behavior concepts.";
            performanceMsg.style.color = "var(--success)";
        } else if (percentage >= 75) {
            performanceMsg.textContent = "Excellent! You have a comprehensive understanding of OB concepts.";
            performanceMsg.style.color = "#4a90e2";
        } else if (percentage >= 60) {
            performanceMsg.textContent = "Good job! You have a solid foundation in Organizational Behavior.";
            performanceMsg.style.color = "#f39c12";
        } else if (percentage >= 50) {
            performanceMsg.textContent = "Fair. Review the topics you missed to strengthen your knowledge.";
            performanceMsg.style.color = "#e67e22";
        } else {
            performanceMsg.textContent = "Keep studying! Review all OB concepts and try again.";
            performanceMsg.style.color = "var(--danger)";
        }
    }

    // Initialize
    totalQuestionsEl.textContent = totalQuestions;
    totalScore.textContent = totalQuestions;
    finalTotal.textContent = totalQuestions;
